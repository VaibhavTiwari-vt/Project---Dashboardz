{% extends "base.html" %}
{% block records %}

<div class="grid grid-cols-12 h-screen">
    <div class="col-span-2">
      {% include "partials/sidebar.html" %}
    </div>
    <main class="col-span-10 h-auto bg-white rounded-3xl m-4 p-6 shadow-lg">
        <form action="" method="post">
            {% csrf_token %}
            <div class="space-y-12">
              <div class="border-b border-gray-900/10 pb-5 flex justify-between items-center">
                <div>
                    <h2 class="text-base/7 font-semibold text-gray-900">New Dashboard</h2>
                    <p class="mt-1 text-sm/6 text-gray-600">Enter the details for the new dashboard.</p>
                </div>
                <div>
                    {% include "messages.html" %}
                </div>
              </div>
                <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                    <div class="sm:col-span-3">
                      <label for="table-name" class="block text-sm/6 font-medium text-gray-900">Table Name</label>
                      <div class="mt-2">
                        <input type="text" name="table-name" id="table-name" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-none focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                      </div>
                    </div>
                </div>
              </div>
          
              <div class="border-b border-gray-900/10 pb-12 mt-10">
                <h2 class="text-base/7 font-semibold text-gray-900">Table Headers</h2>
          
                <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                  <div class="sm:col-span-3">
                    <label for="field-1" class="block text-sm/6 font-medium text-gray-900">Field-1 Name</label>
                    <div class="mt-2">
                      <input type="text" name="field-1" id="field-1" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-none focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                    </div>
                  </div>
          
                  <div class="sm:col-span-3">
                    <label for="field-2" class="block text-sm/6 font-medium text-gray-900">Field-2 Name</label>
                    <div class="mt-2">
                      <input type="text" name="field-2" id="field-2" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-none focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                    </div>
                  </div>

                  <div class="sm:col-span-3">
                    <label for="field-3" class="block text-sm/6 font-medium text-gray-900">Field-3 Name</label>
                    <div class="mt-2">
                      <input type="text" name="field-3" id="field-3" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-none focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                    </div>
                  </div>
                </div>
              </div>

              <div class="mt-4">
                <label class="inline-flex items-center">
                  <input id="add-first-data" name="add-first-data" type="checkbox" class="col-start-1 row-start-1 rounded-sm border border-gray-300 bg-white checked:border-indigo-600 checked:bg-indigo-600 indeterminate:border-indigo-600 indeterminate:bg-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:border-gray-300 disabled:bg-gray-100 disabled:checked:bg-gray-100 forced-colors:appearance-auto">
                  <span class="ml-2 text-sm text-gray-900">Do you want to enter the first data?</span>
                </label>
              </div>

              <div id="first-data-form" class="hidden mt-6 border-b border-gray-900/10 pb-12">
                <h2 class="text-base/7 font-semibold text-gray-900">Enter First Data</h2>
                
                <div class="mt-4 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                  <div class="sm:col-span-3">
                    <label for="data-1" class="block text-sm/6 font-medium text-gray-900">Field-1 Value</label>
                    <div class="mt-2">
                      <input type="text" name="data-1" id="data-1" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-none focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                    </div>
                  </div>

                  <div class="sm:col-span-3">
                    <label for="data-2" class="block text-sm/6 font-medium text-gray-900">Field-2 Value</label>
                    <div class="mt-2">
                      <input type="text" name="data-2" id="data-2" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-none focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                    </div>
                  </div>

                  <div class="sm:col-span-3">
                    <label for="data-3" class="block text-sm/6 font-medium text-gray-900">Field-3 Value</label>
                    <div class="mt-2">
                      <input type="text" name="data-3" id="data-3" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-none focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                    </div>
                  </div>
                  <div class="col-span-full">
                    <label for="about" class="block text-sm/6 font-medium text-gray-900">Description</label>
                    <div class="mt-2">
                      <textarea name="about" id="about" rows="3" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 border border-gray-300 placeholder:text-gray-400 focus:border-none focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"></textarea>
                    </div>
                    <p class="mt-3 text-sm/6 text-gray-600">Write a few words about your data.</p>
                  </div>
                <div class="sm:col-span-3">
                    <label for="date" class="block text-sm font-medium text-gray-900">Select Date</label>
                    <div class="mt-2">
                        <input type="date" id="date" name="date"
                            class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                    </div>
                  </div>
                </div>
              </div>

              <div class="mt-6 flex items-center justify-end gap-x-6">
                <button type="button" class="text-sm/6 font-semibold text-gray-900">Cancel</button>
                <button type="submit" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Save</button>
              </div>
          </form>
    </main>
</div>

<script>
  document.getElementById('add-first-data').addEventListener('change', function() {
    var form = document.getElementById('first-data-form');
    form.classList.toggle('hidden', !this.checked);
  });
</script>

{% endblock records %}
